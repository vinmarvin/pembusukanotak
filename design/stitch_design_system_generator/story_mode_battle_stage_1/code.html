<script>
  (function() {
    let timeLeft = 8.4;
    const maxTime = 10.0;
    const countdownVal = document.getElementById('countdown-val');
    const attackBar = document.getElementById('attack-timer-bar');
    const bossHpBar = document.getElementById('boss-hp-bar');
    const comboPopup = document.getElementById('combo-popup');
    const battleLog = document.getElementById('battle-log');

    // Countdown Timer Loop
    const timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        timeLeft = maxTime;
        // Boss Attack Simulation
        if (battleLog) {
          const entry = document.createElement('div');
          entry.className = 'text-secondary-container bg-surface-container p-1 rounded animate-pulse';
          entry.textContent = 'BOSS ATTACK: Viral Slam hits for 15 HP!';
          battleLog.prepend(entry);
        }
      }
      
      if (countdownVal) {
        countdownVal.textContent = timeLeft.toFixed(1) + 's';
      }
      if (attackBar) {
        const pct = (timeLeft / maxTime) * 100;
        attackBar.style.width = pct + '%';
        if (timeLeft < 3.0) {
          attackBar.className = 'h-full bg-secondary-container rounded transition-all duration-100 ease-linear animate-pulse';
        } else {
          attackBar.className = 'h-full bg-tertiary-container rounded transition-all duration-100 ease-linear';
        }
      }
    }, 100);

    // Interactive Tile Click Feedback
    const tiles = document.querySelectorAll('.grid-tile');
    let selectedTile = null;

    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        if (!selectedTile) {
          selectedTile = tile;
          tile.classList.add('ring-4', 'ring-primary-container', 'scale-105');
        } else if (selectedTile === tile) {
          selectedTile.classList.remove('ring-4', 'ring-primary-container', 'scale-105');
          selectedTile = null;
        } else {
          // Swap visual effect
          const type1 = selectedTile.getAttribute('data-type');
          const type2 = tile.getAttribute('data-type');
          selectedTile.classList.remove('ring-4', 'ring-primary-container', 'scale-105');
          
          // Trigger combo popup animation
          if (comboPopup) {
            comboPopup.classList.remove('scale-100');
            comboPopup.classList.add('scale-125');
            setTimeout(() => {
              comboPopup.classList.remove('scale-125');
              comboPopup.classList.add('scale-100');
            }, 200);
          }

          if (battleLog) {
            const entry = document.createElement('div');
            entry.className = 'text-primary-container bg-surface-container p-1 rounded';
            entry.textContent = 'SWAP: ' + type1 + ' <-> ' + type2 + ' (+180 Attack!)';
            battleLog.prepend(entry);
          }

          selectedTile = null;
        }
      });
    });

    // Clean up interval if page unmounts
    window.addEventListener('beforeunload', () => clearInterval(timerInterval));
  })();
</script></main>
