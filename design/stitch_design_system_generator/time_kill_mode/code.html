<!-- Quick Footer Bar: Match Streak and Multiplier Gauge -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-sm shadow-[0_4px_0_#060208] flex items-center justify-between text-on-surface-variant flex-wrap gap-space-sm"><div class="w-full flex items-center justify-center text-center"><span class="font-label-tag text-lore-caption text-tertiary tracking-wider">TAP TILES TO SWAP • 3-IN-A-ROW TO EXTEND CLOCK</span></div></div>
</div>
</div>
<script>
  (function() {
    let score = 42850;
    let secondsLeft = 84;
    let selectedTile = null;

    const scoreDisplay = document.getElementById('score-ticker');
    const timerDisplay = document.getElementById('countdown-text');
    const progressBar = document.getElementById('timer-progress');
    const vfxFloat = document.getElementById('vfx-float');

    function formatTime(totalSec) {
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Countdown loop simulation
    setInterval(() => {
      if (secondsLeft > 0) {
        secondsLeft -= 1;
        timerDisplay.textContent = formatTime(secondsLeft);
        const percent = Math.max(0, Math.min(100, (secondsLeft / 90) * 100));
        progressBar.style.width = percent + '%';
        if (secondsLeft < 15) {
          progressBar.classList.remove('bg-electric-cyan');
          progressBar.classList.add('bg-secondary-container');
        }
      }
    }, 1000);

    // Interactive Tile Swapping & Micro-interactions
    const tiles = document.querySelectorAll('.match-tile');
    tiles.forEach((tile) => {
      tile.addEventListener('click', () => {
        if (!selectedTile) {
          selectedTile = tile;
          tile.classList.add('ring-4', 'ring-tertiary-container', 'scale-105', 'z-20');
        } else if (selectedTile === tile) {
          selectedTile.classList.remove('ring-4', 'ring-tertiary-container', 'scale-105', 'z-20');
          selectedTile = null;
        } else {
          // Trigger combo score animation
          score += 650;
          scoreDisplay.textContent = String(score).padStart(6, '0');

          // Flash VFX Toast
          vfxFloat.classList.remove('opacity-0');
          vfxFloat.classList.add('opacity-100', '-translate-y-2');
          setTimeout(() => {
            vfxFloat.classList.remove('opacity-100', '-translate-y-2');
            vfxFloat.classList.add('opacity-0');
          }, 600);

          selectedTile.classList.remove('ring-4', 'ring-tertiary-container', 'scale-105', 'z-20');
          tile.classList.add('scale-110');
          setTimeout(() => tile.classList.remove('scale-110'), 150);
          selectedTile = null;
        }
      });
    });

    // Side Power-up Action Triggers
    const freezeBtn = document.getElementById('skill-freeze');
    freezeBtn?.addEventListener('click', () => {
      secondsLeft = Math.min(90, secondsLeft + 6);
      timerDisplay.textContent = formatTime(secondsLeft);
      freezeBtn.classList.add('opacity-50');
    });

    const bombBtn = document.getElementById('skill-bomb');
    bombBtn?.addEventListener('click', () => {
      score += 2500;
      scoreDisplay.textContent = String(score).padStart(6, '0');
      bombBtn.classList.add('opacity-50');
    });

    const multBtn = document.getElementById('skill-multiplier');
    multBtn?.addEventListener('click', () => {
      score += 1500;
      scoreDisplay.textContent = String(score).padStart(6, '0');
      multBtn.classList.add('opacity-50');
    });
  })();
</script></main>
