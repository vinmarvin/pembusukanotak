<script>
  (function() {
    const musicSlider = document.getElementById('musicSlider');
    const musicProgressFill = document.getElementById('musicProgressFill');
    const musicHandle = document.getElementById('musicHandle');
    
    const sfxPillSlider = document.getElementById('sfxPillSlider');
    const sfxProgressFill = document.getElementById('sfxProgressFill');
    const sfxHandle = document.getElementById('sfxHandle');

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, vol) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime((vol / 100) * 0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    function updateMusic(val) {
      const clamped = Math.max(0, Math.min(100, val));
      musicProgressFill.style.width = clamped + '%';
      musicHandle.style.left = 'calc(' + clamped + '% - 20px)';
    }

    function updateSfx(val) {
      const clamped = Math.max(0, Math.min(100, val));
      sfxProgressFill.style.width = clamped + '%';
      sfxHandle.style.left = 'calc(' + clamped + '% - 20px)';
    }

    if (musicSlider) {
      musicSlider.addEventListener('input', (e) => {
        updateMusic(e.target.value);
      });
    }

    if (sfxPillSlider) {
      sfxPillSlider.addEventListener('input', (e) => {
        updateSfx(e.target.value);
        playTone(600 + (e.target.value * 5), e.target.value);
      });
    }

    const okBtn = document.getElementById('soundOkBtn');
    if (okBtn) {
      okBtn.addEventListener('click', (e) => {
        playTone(880, 80);
      });
    }
  })();
</script>

<script>
  // Sound Settings Interactive Logic
  (function() {
    const bgmSlider = document.getElementById('bgmSlider');
    const sfxSlider = document.getElementById('sfxSlider');
    const bgmReadout = document.getElementById('bgmReadout');
    const sfxReadout = document.getElementById('sfxReadout');
    const bgmMuteBtn = document.getElementById('bgmMuteBtn');
    const sfxMuteBtn = document.getElementById('sfxMuteBtn');
    const bgmMuteIcon = document.getElementById('bgmMuteIcon');
    const sfxMuteIcon = document.getElementById('sfxMuteIcon');
    const bgmMuteLabel = document.getElementById('bgmMuteLabel');
    const sfxMuteLabel = document.getElementById('sfxMuteLabel');
    const masterMuteBtn = document.getElementById('masterMuteBtn');
    const masterMuteIcon = document.getElementById('masterMuteIcon');
    const masterMuteText = document.getElementById('masterMuteText');
    const resetDefaultsBtn = document.getElementById('resetDefaultsBtn');
    const bgmPreviewBtn = document.getElementById('bgmPreviewBtn');
    const bgmPlayLabel = document.getElementById('bgmPlayLabel');
    const testSfxBtn = document.getElementById('testSfxBtn');
    const sfxEqDisplay = document.getElementById('sfxEqDisplay');
    const applySaveBtn = document.getElementById('applySaveBtn');
    const saveToast = document.getElementById('saveToast');
    const trackButtons = document.querySelectorAll('.bgm-track-btn');
    const bgmTrackName = document.getElementById('bgmTrackName');

    let prevBgmVal = 75;
    let prevSfxVal = 85;
    let isMasterMuted = false;
    let isPreviewPlaying = false;

    // Web Audio Synthesizer for tactile arcade SFX feedback
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playArcadePip(freq, duration, type = 'sine') {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const vol = (parseInt(sfxSlider.value, 10) / 100) * 0.3;
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Fallback gracefully
      }
    }

    function playMemeComboSfx() {
      if (parseInt(sfxSlider.value, 10) === 0) return;
      playArcadePip(587.33, 0.08, 'triangle'); // D5
      setTimeout(() => playArcadePip(880, 0.08, 'square'), 70); // A5
      setTimeout(() => playArcadePip(1174.66, 0.22, 'sine'), 140); // D6
      
      // Animate Visualizer Bars
      const bars = sfxEqDisplay.children;
      for (let i = 0; i < bars.length; i++) {
        bars[i].style.height = `${Math.floor(Math.random() * 24 + 8)}px`;
      }
      setTimeout(() => {
        for (let i = 0; i < bars.length; i++) {
          bars[i].style.height = `${[8, 16, 24, 12, 28, 20, 8][i]}px`;
        }
      }, 350);
    }

    // Update Slider UI
    function updateBgmUI() {
      const val = parseInt(bgmSlider.value, 10);
      bgmReadout.textContent = val;
      if (val === 0) {
        bgmMuteIcon.textContent = 'volume_off';
        bgmMuteLabel.textContent = 'UNMUTE BGM';
      } else {
        bgmMuteIcon.textContent = 'volume_up';
        bgmMuteLabel.textContent = 'MUTE BGM';
      }
    }

    function updateSfxUI() {
      const val = parseInt(sfxSlider.value, 10);
      sfxReadout.textContent = val;
      if (val === 0) {
        sfxMuteIcon.textContent = 'volume_off';
        sfxMuteLabel.textContent = 'UNMUTE SFX';
      } else {
        sfxMuteIcon.textContent = 'volume_up';
        sfxMuteLabel.textContent = 'MUTE SFX';
      }
    }

    bgmSlider.addEventListener('input', () => {
      updateBgmUI();
      if (parseInt(bgmSlider.value, 10) > 0) prevBgmVal = parseInt(bgmSlider.value, 10);
    });

    sfxSlider.addEventListener('input', () => {
      updateSfxUI();
      if (parseInt(sfxSlider.value, 10) > 0) prevSfxVal = parseInt(sfxSlider.value, 10);
    });

    // Helper exposed for inline tick clicking
    window.setVolume = function(sliderId, val) {
      const slider = document.getElementById(sliderId);
      slider.value = val;
      if (sliderId === 'bgmSlider') {
        updateBgmUI();
        if (val > 0) prevBgmVal = val;
      } else {
        updateSfxUI();
        if (val > 0) prevSfxVal = val;
        playMemeComboSfx();
      }
    };

    // Mute Toggles
    bgmMuteBtn.addEventListener('click', () => {
      if (parseInt(bgmSlider.value, 10) > 0) {
        prevBgmVal = parseInt(bgmSlider.value, 10);
        bgmSlider.value = 0;
      } else {
        bgmSlider.value = prevBgmVal || 75;
      }
      updateBgmUI();
    });

    sfxMuteBtn.addEventListener('click', () => {
      if (parseInt(sfxSlider.value, 10) > 0) {
        prevSfxVal = parseInt(sfxSlider.value, 10);
        sfxSlider.value = 0;
      } else {
        sfxSlider.value = prevSfxVal || 85;
        playMemeComboSfx();
      }
      updateSfxUI();
    });

    // Master Mute Button
    masterMuteBtn.addEventListener('click', () => {
      isMasterMuted = !isMasterMuted;
      if (isMasterMuted) {
        if (parseInt(bgmSlider.value, 10) > 0) prevBgmVal = parseInt(bgmSlider.value, 10);
        if (parseInt(sfxSlider.value, 10) > 0) prevSfxVal = parseInt(sfxSlider.value, 10);
        bgmSlider.value = 0;
        sfxSlider.value = 0;
        masterMuteIcon.textContent = 'volume_up';
        masterMuteText.textContent = 'Unmute All';
        masterMuteBtn.classList.add('bg-error-container', 'text-parchment-light');
      } else {
        bgmSlider.value = prevBgmVal || 75;
        sfxSlider.value = prevSfxVal || 85;
        masterMuteIcon.textContent = 'volume_off';
        masterMuteText.textContent = 'Mute All';
        masterMuteBtn.classList.remove('bg-error-container', 'text-parchment-light');
      }
      updateBgmUI();
      updateSfxUI();
    });

    // Reset Defaults
    resetDefaultsBtn.addEventListener('click', () => {
      bgmSlider.value = 75;
      sfxSlider.value = 85;
      prevBgmVal = 75;
      prevSfxVal = 85;
      isMasterMuted = false;
      masterMuteIcon.textContent = 'volume_off';
      masterMuteText.textContent = 'Mute All';
      masterMuteBtn.classList.remove('bg-error-container', 'text-parchment-light');
      updateBgmUI();
      updateSfxUI();
      playMemeComboSfx();
    });

    // Track Preview Toggle Simulation
    bgmPreviewBtn.addEventListener('click', () => {
      isPreviewPlaying = !isPreviewPlaying;
      if (isPreviewPlaying) {
        bgmPlayLabel.textContent = 'STOPPING...';
        bgmPreviewBtn.classList.add('animate-pulse');
        playArcadePip(440, 0.4, 'triangle');
        setTimeout(() => {
          bgmPlayLabel.textContent = 'TRACK PLAYING';
        }, 300);
      } else {
        bgmPlayLabel.textContent = 'TEST TRACK';
        bgmPreviewBtn.classList.remove('animate-pulse');
      }
    });

    // Track Preset Selection
    trackButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        trackButtons.forEach(b => {
          b.classList.remove('bg-secondary-container', 'text-surface-container-lowest');
          b.classList.add('bg-surface-container', 'text-on-surface');
        });
        btn.classList.remove('bg-surface-container', 'text-on-surface');
        btn.classList.add('bg-secondary-container', 'text-surface-container-lowest');
        bgmTrackName.textContent = btn.dataset.track;
        playArcadePip(660, 0.15, 'sawtooth');
      });
    });

    // Test SFX
    testSfxBtn.addEventListener('click', () => {
      playMemeComboSfx();
    });

    // Apply & Save with feedback toast
    applySaveBtn.addEventListener('click', () => {
      playMemeComboSfx();
      saveToast.classList.remove('hidden');
      setTimeout(() => {
        saveToast.classList.add('hidden');
      }, 3500);
    });

    // Initialize values on first load
    updateBgmUI();
    updateSfxUI();
  })();
</script></main>


</body></html>
